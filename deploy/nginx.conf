# HTTP(80): 인증서 발급·갱신용 경로만 열어 두고, 나머지는 HTTPS로 보냄
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.findpawpose.site$request_uri;
    }
}

# HTTPS(443): 실제 API
server {
    listen 443 ssl;
    http2 on;
    server_name api.findpawpose.site;

    ssl_certificate     /etc/letsencrypt/live/api.findpawpose.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.findpawpose.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 사진 업로드 (application.yml의 max-request-size 50MB와 맞춤)
    client_max_body_size 50m;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # 외부에서 보낸 값을 덮어써서 Spring이 조작된 호스트를 믿지 않게 함
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }
}
