name: Deploy

# main 에 머지(push)되면 자동 배포. Actions 탭에서 수동 실행도 가능
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 0) 테스트: 실패하면 이미지 빌드·배포를 하지 않음 (서버는 이전 버전 유지)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash gradlew --no-daemon test

  # 1) Spring 이미지 빌드 → Docker Hub push (태그: latest, 커밋 SHA)
  backend-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # 2) 임베딩 이미지: embedding-service 가 바뀌었거나, Docker Hub 에 아직 이미지가 없을 때만 빌드
  embedding-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: check
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-embedding:latest
          BEFORE: ${{ github.event.before }}
        run: |
          build=false
          if [ ! -f embedding-service/server.py ]; then
            echo "embedding-service 코드가 없어 건너뜁니다."
          elif ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Docker Hub 에 이미지가 아직 없어 빌드합니다."; build=true
          elif [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "수동 실행 또는 비교 기준이 없어 빌드합니다."; build=true
          elif ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- embedding-service; then
            echo "embedding-service 가 바뀌어 빌드합니다."; build=true
          else
            echo "embedding-service 변경 없음 → 기존 latest 이미지 사용"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./embedding-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-embedding:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-embedding:${{ github.sha }}
          cache-from: type=gha,scope=embedding
          cache-to: type=gha,mode=max,scope=embedding

  # 3) EC2 에 SSH 접속 → 새 이미지 받아서 재시작
  deploy:
    needs: [backend-image, embedding-image]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: cd ~/Backend && git pull --ff-only origin main && bash deploy/deploy.sh ${{ github.sha }}
