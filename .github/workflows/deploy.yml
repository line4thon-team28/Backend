name: Deploy

# main 에 머지(push)되면 자동 배포. Actions 탭에서 수동 실행도 가능
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Spring 이미지 빌드 → Docker Hub push (태그: latest, 커밋 SHA)
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # 2) 임베딩 이미지: 매칭 코드(embedding-service/server.py)가 main 에 있을 때만 빌드
  embedding-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f embedding-service/server.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "embedding-service 코드가 아직 main 에 없어 건너뜁니다."
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./embedding-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-embedding:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawpose-embedding:${{ github.sha }}
          cache-from: type=gha,scope=embedding
          cache-to: type=gha,mode=max,scope=embedding

  # 3) EC2 에 SSH 접속 → 새 이미지 받아서 재시작
  deploy:
    needs: [backend-image, embedding-image]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: bash ~/Backend/deploy/deploy.sh ${{ github.sha }}
