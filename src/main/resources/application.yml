spring:
  application:
    name: pawpose
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  # 기본값 없음: prod 에서 JWT_SECRET 이 없으면 서버가 시작되지 않음
  secret: ${JWT_SECRET}
  access-token-validity-days: 7

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  default-support-form-data: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

pawpose:
  collection:
    enabled: ${PUBLIC_DATA_COLLECTION_ENABLED:false}
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  matching:
    enabled: ${MATCHING_WORKER_ENABLED:false}
    embedding-url: ${EMBEDDING_URL:http://127.0.0.1:8091/embed}
    embedding-key: ${EMBEDDING_API_KEY:}
    image-hosts: ${MATCHING_IMAGE_HOSTS:www.animal.go.kr,openapi.animal.go.kr}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:pawpose;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

# 로컬 전용 개발 키 (.env 에 JWT_SECRET 이 있으면 그 값이 우선)
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-0123456789}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
